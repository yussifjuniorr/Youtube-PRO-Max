name: Build Cinema YouTube APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project
        id: locate
        run: |
          FOUND=$(find . -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$FOUND" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d extracted_project
              FOUND=$(find ./extracted_project -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
            fi
          fi
          if [ -z "$FOUND" ]; then
            echo "ERROR: Project files not found!"
            ls -la
            exit 1
          fi
          PROJ_DIR=$(dirname "$FOUND")
          echo "dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project in: $PROJ_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-YouTube-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
