name: Build Cinema YouTube Native Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract native project
        id: locate
        run: |
          LATEST_ZIP=$(ls -1v CinemaYouTube-Native-*.zip 2>/dev/null | tail -n 1 || true)
          if [ -n "$LATEST_ZIP" ] && [ -f "$LATEST_ZIP" ]; then
            echo "Found archive: $LATEST_ZIP"
            rm -rf extracted_native
            unzip -o "$LATEST_ZIP" -d extracted_native
            FOUND=$(find ./extracted_native -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          else
            FOUND=$(find . -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          fi
          if [ -z "$FOUND" ]; then
            echo "ERROR: Project files not found!"
            ls -la
            exit 1
          fi
          PROJ_DIR=$(dirname "$FOUND")
          echo "dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "Building from: $PROJ_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare Release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CinemaYouTube-Release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-YouTube-Native-Release-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/CinemaYouTube-Release.apk
          if-no-files-found: error
