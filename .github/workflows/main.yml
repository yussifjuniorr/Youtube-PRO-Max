name: Build Cinema YouTube APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract project
        id: locate
        run: |
          if [ -f "CinemaYouTube-Android-v2.zip" ]; then
            rm -rf extracted_v2
            unzip -o "CinemaYouTube-Android-v2.zip" -d extracted_v2
            FOUND=$(find ./extracted_v2 -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          else
            FOUND=$(find . -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)
          fi
          PROJ_DIR=$(dirname "$FOUND")
          echo "dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-YouTube-v2-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
